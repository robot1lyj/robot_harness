[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-rsi-harness"
version = "0.4.1"
description = "Robot task harness with optional typed adapters, skills and scoped memory"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.30,<2",
  "numpy>=1.26,<3",
  "packaging>=24,<27",
  "pillow>=10,<13",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
robot-rsi = "robot_rsi.cli:main"

[project.entry-points."robot_rsi.skills"]
builtins = "robot_rsi.skill_management:installed_packages"

[project.entry-points."robot_rsi.adapters"]
mock = "robot_rsi.host:mock_adapter"
yam_legacy = "robot_rsi.host:legacy_adapter"

[dependency-groups]
dev = [
    "pyperf>=2.10.0",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robot_rsi"]

[tool.hatch.build.targets.wheel.force-include]
"docs/integration.md" = "robot_rsi/resources/guides/integration.md"
"docs/interfaces.md" = "robot_rsi/resources/guides/interfaces.md"
"docs/skill-authoring.md" = "robot_rsi/resources/guides/skill-authoring.md"
"docs/project-workflow.md" = "robot_rsi/resources/guides/project-workflow.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
