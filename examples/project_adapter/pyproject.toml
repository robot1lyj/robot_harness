[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-rsi-lab-adapter"
version = "0.4.1"
requires-python = ">=3.12,<3.14"
dependencies = ["robot-rsi-harness==0.3.1"]

[project.entry-points."robot_rsi.adapters"]
legacy_lab = "lab_adapter:factory"

[project.entry-points."robot_rsi.skills"]
lab_methods = "lab_adapter:installed_packages"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_adapter"]

[tool.hatch.build.targets.wheel.force-include]
"../legacy_lab/__init__.py" = "legacy_lab/__init__.py"
"../legacy_lab/capture.py" = "legacy_lab/capture.py"
"../legacy_lab/geometry.py" = "legacy_lab/geometry.py"
"../legacy_lab/recordings.json" = "legacy_lab/recordings.json"
"skills/measure" = "lab_adapter/skills/measure"
"skills/inspect" = "lab_adapter/skills/inspect"
